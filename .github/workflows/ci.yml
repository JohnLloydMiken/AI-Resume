name: Ci

on:
    push:
        branches: ["**"]
    pull_request: 
        branches: ["**"]

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: "20"
          cache: "npm"
      - name: Install Dependecies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Typscript check
        run: npx tsc --noEmit

  build:
    name: Build check
    runs-on: ubuntu-latest
 
    # "needs:" makes this job wait for "quality" to pass first.
    # No point building if lint/types already failed.
    needs: quality
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
 
      - name: Install dependencies
        run: npm ci
 
      # The Next.js build needs your API key as an env variable.
      # "${{ secrets.ANTHROPIC_API_KEY }}" reads from GitHub repo secrets —
      # the key is NEVER stored in your code or visible in logs.
      # Set this up at: GitHub repo → Settings → Secrets → Actions
      - name: Build Next.js app
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        
        
